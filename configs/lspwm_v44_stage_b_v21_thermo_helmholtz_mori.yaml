# LSP-WM v21: Thermodynamic Helmholtz-Mori JEPA (THM-JEPA)
#
# Adds reversible (divergence-free) drift J∇H to the dissipative -M∇F + C·a
# Init: v20 step-6000 checkpoint

init_checkpoint: artifacts/lspwm_v44_stage_b_v20_force_alignment/checkpoint_step6000.pt
init_exclude_prefixes:
  - lspwm.world_model.physical_calibration.log_mobility_scale
  - lspwm.world_model.physical_calibration.log_free_energy_scale
  - lspwm.world_model.reversible_potential.
  - lspwm.world_model.skew_operator.
sync_target_after_init: true
strict_init: false
init_copy_temporal_to_offline: false

data:
  manifest_path: manifests/tmjepa_v3.train.jsonl
  batch_size: 32
  num_workers: 8
  training_mode: clip

mask:
  mode: block
  num_blocks: 2
  temporal_scale: [0.15, 0.3]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2
  future_context_ratio: 0.5

model:
  paired_forecast: true
  latent_dim: 256
  temporal_depth: 4
  temporal_causal: true
  lspwm_enabled: true
  lspwm_learned_cv_dim: 256
  lspwm_condition_dim: 64
  lspwm_auxiliary_dim: 4
  lspwm_reference_temperature_k: 348.0
  lspwm_diffusion_scale: 1.0e-6
  lspwm_coupling_scale: 1.0e-3
  lspwm_memory_times_ps: [1000.0, 2000.0, 4000.0, 8000.0]
  lspwm_physical_calibration_enabled: true
  lspwm_physical_mobility_init: 1.0
  lspwm_physical_free_energy_init: 1.0
  lspwm_reversible_dynamics_enabled: true
  lspwm_reversible_operator_rank: 16
  lspwm_reversible_hidden_dim: 128
  lspwm_reversible_hidden_depth: 4
  lspwm_curriculum_steps: [0, 500, 1500, 3000, 5000]

optimization:
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 6
  paired_delta_weight: 0.02
  paired_state_weight: 0.0
  paired_relative_delta_weight: 0.0
  lspwm_dynamic_weight: 1.0
  lspwm_calibrated_dynamic_weight: 1.0
  lspwm_force_weight: 1.0

seed: 6303
deterministic: false
device: cuda
output_dir: artifacts/lspwm_v44_stage_b_v21_thermo_helmholtz_mori
log_every: 10
save_every: 10000
checkpoint_every_steps: 100