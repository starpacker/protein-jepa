# LSP-WM v4.1 canonical contract. This file is consumed by the standalone
# smoke/evaluation entry point first; protein training is promoted only after
# the structural and matched-protocol gates pass.
framework: LSP-WM-v4.1
protocol: coarse_grained_overdamped

state:
  dimension: 256
  fixed_physical_dimension: 16
  learned_dimension: 256
  role_readouts:
    koopman: 64
    msm: 32
    geometric: 96
    auxiliary: 64
  role_parameterization: full_state_readouts_not_coordinate_slices
  condition_dimension: 64
  reference_temperature_k: 348.0

potential:
  parameterization: scalar_mean_force_potential
  target: kde_mean_force
  force_matching: true
  integrability_check: true

diffusion:
  parameterization: global_cholesky
  state_dependent: false
  temperature_scaling: linear
  diffusion_scale: 0.001
  diagonal_floor: 1.0e-6

bath:
  parameterization: gauge_fixed_markovian_embedding
  auxiliary_dimension: 4
  relaxation_times_ps: [1000.0, 2000.0, 4000.0, 8000.0]
  coupling_scale: 0.001
  orthogonal_basis: true
  spectral_ordering: true

losses:
  representation: jepa_predictive
  koopman: vamp2_multilag
  dynamics: overdamped_transition_nll
  force: mean_force_matching
  observation: asymmetric_observation_cycle

curriculum:
  - representation
  - koopman
  - thermodynamic_identification
  - dynamics
  - observation

verification:
  synthetic_contract: scripts/evaluate_lspwm.py --synthetic
  required_gates:
    - diffusion_psd
    - fdt_residual
    - energy_integrability
    - koopman_diagnostics
    - held_out_endpoint_comparison
  baseline_checkpoint: artifacts/eva5c_tmjepa_v3_quadratic_latent_closure/checkpoint_step375_gate2.pt
  baseline_macro_skill_percent: 28.687
  baseline_status: internal_validation_only
