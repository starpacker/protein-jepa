# P4.1: Temperature jump intervention experiment config
# Train on 4 fixed temperatures, test on temperature jumps.
#
# Training: 320K, 348K, 379K, 413K equilibrium
# Intervention: 348K equilibration → jump to 413K → record trajectory
#
# Required model: Stage B trained with rollout (P2)
# Required energy: temperature-conditioned (P4.2)

output_dir: artifacts/mdcath_temp_intervention
seed: 42
deterministic: false
log_every: 10
save_every: 1
checkpoint_every_steps: 500
device: cuda
init_checkpoint: artifacts/mdcath_stage_b_rollout/checkpoint_latest.pt
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 1
  num_workers: 2
  num_frames: 4
  frame_stride: 4
  window_stride: 4
  max_residues: 128
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: true
  paired_history_mode: uniform

model:
  model_type: stage_b
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  lspwm_per_residue_enabled: true
  lspwm_use_bath: true
  lspwm_history_aware: true
  lspwm_rollout_enabled: true
  lspwm_rollout_steps: 4
  # Energy graph: temperature-conditioned for intervention
  reference_temperature_k: 348.0

optimization:
  lr: 1.0e-5
  epochs: 10
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 10.0
  gradient_accumulation_steps: 1
  steps_per_epoch: 300
  lagged_state_jepa_weight: 1.0
  state_jepa_weight: 0.1
  variance_reg: 0.01
  lspwm_rollout_trajectory_nll_weight: 0.3
  lspwm_semigroup_consistency_weight: 0.1

# Temperature sampling strategy: multinomial over 4 fixed temperatures
temperature_sampling:
  mode: categorical  # categorical | continuous
  values: [320.0, 348.0, 379.0, 413.0]
  train_only: true

# Intervention protocol
intervention:
  equilibrium_steps: 10       # steps to equilibrate before jump
  jump_delta_k: [0, 65, 31, -28]  # T_jump - T_init for each [320,348,379,413]
  jump_duration_steps: 50     # steps to run after jump
  compare_temperatures: [320, 348, 379, 413]  # sample equilibrium at these temps for comparison
  step_ps: 100.0
