seed: 0
device: auto
output_dir: artifacts/mdcath_full
log_every: 20
save_every: 1

data:
  manifest_path: /liuyutian/protein_jepa/artifacts/manifests/mdcath.train.jsonl
  batch_size: 4
  num_workers: 4
  num_frames: 8
  frame_stride: 2
  window_stride: 8
  max_residues: 384

mask:
  num_blocks: 2
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

model:
  latent_dim: 128
  encoder_depth: 4
  predictor_depth: 4
  num_heads: 4
  num_rbf: 16
  dropout: 0.1
  max_frames: 64
  max_residues: 4096
  feature_norm: true

optimization:
  epochs: 10
  steps_per_epoch:
  lr: 0.0003
  encoder_lr_scale: 0.2
  weight_decay: 0.05
  warmup_steps: 1000
  ema_start: 0.996
  ema_end: 1.0
  grad_clip: 1.0
  precision: float32
  variance_reg: 0.0
