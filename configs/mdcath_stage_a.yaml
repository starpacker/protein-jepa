# Stage A: JEPA representation learning on mdCATH (5 temperatures, 320K-450K)
# Fresh training from scratch — no init_checkpoint.
#
# Key design: physical time conditioning in temporal encoder +
#   wide frame strides + multi-horizon prediction forces encoder to
#   learn temporally-sensitive representations.
#   8-frame windows × stride 4 = ~28ns context window.
#   Horizons: 4, 8, 16 frames × stride 4 = 16ns, 32ns, 64ns.
output_dir: artifacts/mdcath_stage_a
seed: 42
deterministic: false
log_every: 50
save_every: 1
checkpoint_every_steps: 5000

data:
  manifest_path: artifacts/mdcath_manifest/train.jsonl
  batch_size: 32
  num_workers: 4
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [4, 8, 16]
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  # Physical time conditioning forces encoder to be time-aware
  time_conditioning: "physical"
  thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 3
  paired_teacher_space_delta: true
  lspwm_enabled: false

mask:
  mode: block
  num_blocks: 2
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 3.0e-4
  encoder_lr_scale: 0.5
  epochs: 100
  warmup_steps: 2000
  weight_decay: 0.05
  grad_clip: 1.0
  ema_start: 0.996
  ema_end: 1.0
  precision: float32
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.25
  paired_delta_weight: 1.0
  paired_state_weight: 0.25
  variance_reg: 0.01
  state_variance_reg: 0.01
  state_feature_variance_reg: 0.01
  state_covariance_reg: 0.02
