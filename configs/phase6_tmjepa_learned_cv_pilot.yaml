seed: 6102
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/phase6_tmjepa_learned_cv_closure_pilot
log_every: 10
save_every: 1
checkpoint_every_steps: 100

data:
  manifest_path: /liuyutian/protein_jepa_frame/manifests/tmjepa_pilot20.train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 24
  frame_stride: 1
  window_stride: 4
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [1, 2, 4, 8, 16]
  paired_nonoverlap_only: false
  paired_all_horizons: true
  paired_history_mode: uniform
  load_forces: false

model:
  latent_dim: 64
  encoder_depth: 2
  temporal_depth: 2
  predictor_depth: 1
  paired_forecast: true
  paired_predictor_depth: 1
  temporal_causal: true
  temporal_position_encoding: none
  orientation_features: true
  frame_pooling: kinetic_query
  frame_pool_queries: 4
  num_heads: 4
  num_rbf: 16
  dropout: 0.05
  max_frames: 64
  max_residues: 4096
  feature_norm: false
  tmjepa_enabled: true
  tmjepa_num_segments: 3
  tmjepa_learned_cv_dim: 4
  tmjepa_condition_dim: 64
  tmjepa_auxiliary_dim: 4
  tmjepa_memory_enabled: true
  tmjepa_base_step_ps: 1000.0
  tmjepa_max_rollout_steps: 256
  tmjepa_ensemble_size: 8
  tmjepa_diffusion_floor: 1.0e-8
  tmjepa_diffusion_scale: 1.0e-5
  tmjepa_relaxation_rate_scale: 1.0e-3
  tmjepa_coupling_scale: 1.0e-3
  tmjepa_equilibrium_noise_std: 0.05
  tmjepa_contact_width_angstrom: 0.75

optimization:
  epochs: 1
  steps_per_epoch: 300
  lr: 0.0002
  encoder_lr_scale: 0.05
  weight_decay: 0.0001
  warmup_steps: 50
  ema_start: 0.996
  ema_end: 0.999
  grad_clip: 1.0
  precision: float32
  paired_delta_weight: 0.0
  paired_state_weight: 0.0
  paired_endpoint_variance_weight: 0.0
  tmjepa_energy_score_weight: 1.0
  tmjepa_transition_nll_weight: 0.0001
  tmjepa_equilibrium_score_weight: 0.0001
  tmjepa_innovation_mean_weight: 0.1
  tmjepa_innovation_covariance_weight: 0.1
  tmjepa_innovation_autocorrelation_weight: 0.1
  tmjepa_auxiliary_kl_weight: 0.01
  tmjepa_learned_cv_variance_weight: 0.05
  tmjepa_learned_cv_covariance_weight: 0.005
  tmjepa_vamp_weight: 0.1
