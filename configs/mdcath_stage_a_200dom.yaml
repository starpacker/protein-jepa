# ═══════════════════════════════════════════════════════════════════════════════
# STATUS: INVALID_OVERLAP — DO NOT USE FOR PAPER TABLES
# ═══════════════════════════════════════════════════════════════════════════════
# This config has context/future frame overlap:
#   num_frames=8, frame_stride=4 → context=[0,4,8,12,16,20,24,28] (raw)
#   horizon 4  → 7/8 shared (87.5%)
#   horizon 8  → 6/8 shared (75%)
#   horizon 16 → 4/8 shared (50%)
# Results from this config are: legacy / unverified / not attributable to
# the current canonical pipeline.  Use configs/mdcath_stage_a_nonoverlap.yaml
# for any paper-eligible training.
# ═══════════════════════════════════════════════════════════════════════════════
output_dir: artifacts/mdcath_stage_a_200dom
seed: 42
deterministic: false
log_every: 50
save_every: 1
checkpoint_every_steps: 5000
device: cuda

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 32
  num_workers: 4
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [4, 8, 16]
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: "physical"
  thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 3
  paired_teacher_space_delta: true
  lspwm_enabled: false
  use_dynamic_encoder: false  # LEGACY: predates Gate 1 dynamic encoder

mask:
  mode: block
  num_blocks: 2
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 3.0e-4
  encoder_lr_scale: 0.5
  epochs: 30
  warmup_steps: 1000
  weight_decay: 0.05
  grad_clip: 1.0
  ema_start: 0.996
  ema_end: 1.0
  precision: float32
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.25
  paired_delta_weight: 1.0
  paired_state_weight: 0.25
  variance_reg: 0.01
  state_variance_reg: 0.01
  state_feature_variance_reg: 0.01
  state_covariance_reg: 0.02
