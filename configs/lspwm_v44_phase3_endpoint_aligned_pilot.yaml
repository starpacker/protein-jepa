# Phase 3: frozen-latent, FDT-consistent one-step transition calibration.
#
# Initialization is the validated Stage B DetSkill v3 checkpoint.  The JEPA
# representation and the original LSP-WM dynamics are frozen; only the
# scalar mobility/free-energy scales and the bounded conservative correction
# are optimized.
seed: 7311
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_phase3_endpoint_aligned_pilot
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_stage_b_detskill_fix_v3/checkpoint_step3000.pt
strict_init: false  # historical checkpoint has unused physical-time embed keys
sync_target_after_init: false
log_every: 10
save_every: 1
checkpoint_every_steps: 50

data:
  manifest_path: /liuyutian/protein_jepa_frame/manifests/tmjepa_v3.train.jsonl
  batch_size: 8
  num_workers: 0
  num_frames: 24
  frame_stride: 1
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
