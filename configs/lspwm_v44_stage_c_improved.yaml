# LSP-WM v4.4 Stage C: Improved thermodynamic fitting with curriculum.
#
# Improvements over Stage B v2:
#   1. Deeper PMF potential (4-layer, 256-dim hidden) for complex landscapes
#   2. True curriculum: representation→thermo→dynamics→rollout→observation
#   3. Rollout training enabled (multi-step self-consistency)
#   4. Observation model enabled (decode latent→CV space)
#   5. State-dependent diffusion with per-sample variance
#   6. Higher learning rate for faster convergence
#   7. Adaptive KDE bandwidth range-switching
#   8. End-to-end fine-tuning of learned projection in later stages
#
# The five canonical losses (Ch.7) are phase-gated:
#   L_repr : VAMP-2/Koopman (phase 0)
#   L_force: PMF mean-force matching (phase 1+)
#   L_dyn  : Overdamped transition NLL (phase 1+)
#   L_roll : Multi-step rollout self-consistency (phase 3+)
#   L_obs  : Observation model / decoder (phase 4+)

seed: 6442
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_stage_c_improved
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_stage_b_single_step_thermodynamics_v2/checkpoint_latest.pt
strict_init: false        # needed because architecture changed (deeper potential)
init_exclude_prefixes: []
sync_target_after_init: false
log_every: 10
save_every: 1
checkpoint_every_steps: 250

data:
  manifest_path: /liuyutian/protein_jepa_frame/manifests/tmjepa_v3.train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 24
  frame_stride: 1
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [24, 48, 96]
  paired_nonoverlap_only: true
  paired_all_horizons: true

model:
  latent_dim: 256
  encoder_depth: 2
  temporal_depth: 2
  predictor_depth: 1
  paired_forecast: true
  paired_predictor_depth: 2
  temporal_causal: true
  temporal_causal_window: 4
  temporal_position_encoding: none
  orientation_features: true
  frame_pooling: kinetic_query
  frame_pool_queries: 4
  num_heads: 8
  num_rbf: 16
  dropout: 0.0
  feature_norm: true
  freeze_context_encoder: true        # Stage A encoder frozen
  freeze_temporal_encoder: true       # Stage A temporal encoder frozen
  freeze_target_encoders: true        # Target encoders always frozen
  lspwm_freeze_learned_projection: true  # Projection frozen during thermodynamic fit
  tmjepa_enabled: false
  lspwm_enabled: true
  lspwm_num_segments: 3
  lspwm_learned_cv_dim: 256
  lspwm_condition_dim: 64
  lspwm_auxiliary_dim: 4
  lspwm_koopman_role_dim: 64
  lspwm_msm_role_dim: 32
  lspwm_geometric_role_dim: 96
  lspwm_auxiliary_role_dim: 64
  lspwm_role_hidden_dim: 256
  lspwm_reference_temperature_k: 348.0
  lspwm_diffusion_scale: 5.0e-5
  lspwm_coupling_scale: 1.0e-4
  lspwm_memory_times_ps: [4000.0, 16000.0, 64000.0, 128000.0]
  lspwm_mean_force_bandwidth: 0.1       # fixed small bandwidth for Tanh space
  lspwm_state_dependent_diffusion: true  # heteroscedastic diagonal head
  lspwm_force_loss_enabled: true        # independent from dynamic_nll_enabled
  lspwm_potential_hidden_dim: 256       # deeper PMF for complex landscapes
  lspwm_potential_hidden_depth: 4       # 4 hidden layers (was 2)
  lspwm_observation_model: false        # observation model disabled for now
  lspwm_history_closure_enabled: false
  lspwm_rollout_enabled: true           # rollout enabled
  lspwm_rollout_steps: 4               # 4-step rollout
  lspwm_rollout_warmup_steps: 0
  lspwm_rollout_ensemble_size: 8
  lspwm_rollout_intermediate_supervision: true
  lspwm_rollout_gaussian_nll_enabled: true
  lspwm_dynamic_nll_enabled: true
  # Curriculum: representation(0)→thermo_id(1)→dynamics(2)→rollout(3)→observation(4)
  # Stage B init already has a reasonable PMF; start in dynamics phase
  lspwm_curriculum_steps: [0, 0, 0, 4000, 6000]
  # Stage B init already has a reasonable PMF; skip representation phase
  lspwm_cv_mean: [0.5808744431, 1.0378025770, -3.5378422730, -1.6780833006, 0.3800410033, -2.7798459530, 0.3983616233, -2.7939324379, 0.3888407946, -2.7732858658, 0.4555905461, 0.3484444022, 1.0433561802, -0.0431454852, -0.0774244592, -0.2054995447]
  lspwm_cv_scale: [0.0796646103, 0.5420896411, 0.1517379731, 0.3564364311, 0.1541653872, 0.2375139445, 0.1466855109, 0.2658485472, 0.1382870525, 0.2666960061, 0.3291336298, 0.4681170881, 0.1254781187, 0.0886877403, 0.1492052078, 0.2059004903]

optimization:
  epochs: 3
  steps_per_epoch: 2000     # 6000 total steps for thorough convergence
  lr: 3.0e-5               # Higher LR for world model parameters
  encoder_lr_scale: 0.0     # Encoders frozen
  weight_decay: 1.0e-5
  warmup_steps: 200         # Longer warmup for deeper network
  grad_clip: 1.0

  # JEPA endpoints (from Stage A — kept for compatibility, zero-weighted)
  paired_delta_weight: 0.0
  paired_state_weight: 0.0
  paired_relative_delta_weight: 0.0
  paired_endpoint_variance_weight: 0.0

  # === LSP-WM canonical losses (Ch.7) ===

  # Phase 0-1: Representation (VAMP-2 / Koopman subspace)
  lspwm_dynamic_weight: 0.01        # L_dyn: overdamped transition NLL
  lspwm_force_weight: 0.05          # L_force: PMF mean-force matching
  lspwm_koopman_weight: 0.0         # L_koop: VAMP-2 score (representation phase)
  lspwm_msm_weight: 0.0
  lspwm_sequence_vamp_weight: 0.0
  lspwm_sequence_vamp_lag: 1
  lspwm_geometric_weight: 0.0
  lspwm_auxiliary_weight: 0.0
  lspwm_observation_weight: 0.0     # L_obs: observation model (phase 4)

  # Phase 3-4: Rollout self-consistency
  lspwm_rollout_energy_weight: 0.0
  lspwm_rollout_endpoint_weight: 0.0
  lspwm_rollout_gaussian_nll_weight: 0.0
  lspwm_rollout_distribution_weight: 0.0
  lspwm_rollout_koopman_weight: 0.0
  lspwm_rollout_force_weight: 0.0
  lspwm_rollout_trajectory_nll_weight: 0.0