# LSP-WM v4.4 Stage B v5: Fix PMF training + multi-step dynamics.
#
# Root cause: the Stage B PMF learns nothing because the KDE mean-force
# target collapses to zero (self-reference entry dominates softmax) when
# bandwidth=0.05 is too narrow for Tanh-normalized states in [-1,1]^256.
#
# Changes from v4 (lspwm_v44_stage_b_v4_architectural.yaml):
#   1. lspwm_mean_force_bandwidth: 0.05 → 0.0 (adaptive — THE critical fix)
#   2. epochs: 4 → 5 (5000 steps → 2500 dynamics-phase steps)
#   3. curriculum_steps: [500,1500,3000,...] → [0,1000,2500,4000,5000]
#   4. lspwm_dynamic_weight: 0.01 → 0.1 (balance vs Koopman gradient)
#   5. lspwm_koopman_weight: 0.1 → 0.05 (compensate for increased dyn)
#   6. lspwm_force_weight: 0.05 → 0.1 (non-zero target now)
#   7. lspwm_midpoint_integration: false → true (BAOAB, O(dt^2))
#   8. lspwm_rollout_trajectory_steps: 0 → 4 (multi-step path NLL)
#   9. lspwm_trajectory_weight: 0.0 → 0.1
#   10. lspwm_semigroup_consistency_weight: 0.0 → 0.01
#
seed: 6445
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_stage_b_v5_fixed_pmf
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/lspwm_v44_stage_a_representation/checkpoint_latest.pt
init_exclude_prefixes:
  - "lspwm.world_model.diffusion."
strict_init: false
sync_target_after_init: false
log_every: 10
save_every: 1
checkpoint_every_steps: 100

data:
  manifest_path: /liuyutian/protein_jepa_frame/manifests/tmjepa_v3.train.jsonl
  batch_size: 8
  num_workers: 0
  num_frames: 24
  frame_stride: 1
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [24, 48, 96]
  paired_nonoverlap_only: true
  paired_all_horizons: true

model:
  latent_dim: 256
  encoder_depth: 2
  temporal_depth: 2
  predictor_depth: 3           # Kept from v4: deeper JEPA predictor
  state_predictor_depth: 3     # Kept from v4
  frame_pooling: kinetic_query
  frame_pool_queries: 4
  lag_predictor_depth: 3       # Kept from v4
  time_conditioning: physical   # Kept from v4: explicit Δt conditioning
  thermodynamic_conditioning: false
  orientation_features: true
  temporal_causal: true
  temporal_causal_window: 4
  temporal_position_encoding: none
  temporal_delta_features: false
  motion_depth: 0
  transition_source: state
  num_heads: 8
  num_rbf: 16
  dropout: 0.0
  max_frames: 256
  max_residues: 4096
  feature_norm: true
  paired_forecast: true
  paired_predictor_depth: 3    # Kept from v4
  freeze_context_encoder: true  # Kept frozen — no latent collapse
  freeze_temporal_encoder: true # Kept frozen
  freeze_target_encoders: true  # Kept frozen
  tmjepa_enabled: false

  # LSP-WM core
  lspwm_enabled: true
  lspwm_num_segments: 3
  lspwm_learned_cv_dim: 256
  lspwm_condition_dim: 64
  lspwm_auxiliary_dim: 4
  lspwm_koopman_role_dim: 64
  lspwm_msm_role_dim: 32
  lspwm_geometric_role_dim: 96
  lspwm_auxiliary_role_dim: 64
  lspwm_role_hidden_dim: 256
  lspwm_reference_temperature_k: 348.0
  lspwm_diffusion_scale: 5.0e-5     # Unchanged: D-invariant NLL gradient
  lspwm_coupling_scale: 1.0e-4
  lspwm_memory_times_ps: [4000.0, 16000.0, 64000.0, 128000.0]
  lspwm_mean_force_bandwidth: 0.0   # ← CRITICAL FIX: use adaptive bandwidth
  lspwm_observation_model: false
  lspwm_history_closure_enabled: false

  # Architectural revisions (v4.4+)
  # Rev-1: BAOAB midpoint integration for better long-horizon stability
  lspwm_midpoint_integration: true
  # Rev-2: Multi-step rollout trajectory NLL (K = 4 rollout steps)
  lspwm_rollout_trajectory_steps: 4
  # Rev-4: Semigroup cross-timescale consistency
  lspwm_semigroup_consistency_weight: 0.01

  # Rev-3: Learned auxiliary initializer
  lspwm_rollout_enabled: false
  lspwm_dynamic_nll_enabled: true
  lspwm_force_loss_enabled: true
  lspwm_state_dependent_diffusion: true
  lspwm_freeze_learned_projection: true  # Keep frozen

  # Potential architecture
  lspwm_potential_hidden_dim: 128
  lspwm_potential_hidden_depth: 2

  # Curriculum: adapted for 5 epochs (5000 steps)
  #   [0, 1000, 2500, 4000, 5000]
  #   0-999:    representation (VAMP-2 only)
  #   1000-2499: thermodynamic_identification (force + NLL)
  #   2500-3999: dynamics (NLL only)
  #   4000-4999: rollout (multi-step, never reached if we limit)
  lspwm_curriculum_steps: [0, 1000, 2500, 4000, 5000]

  # CV normalization (same as Stage A)
  lspwm_cv_mean: [0.5808744431, 1.0378025770, -3.5378422730, -1.6780833006, 0.3800410033, -2.7798459530, 0.3983616233, -2.7939324379, 0.3888407946, -2.7732858658, 0.4555905461, 0.3484444022, 1.0433561802, -0.0431454852, -0.0774244592, -0.2054995447]
  lspwm_cv_scale: [0.0796646103, 0.5420896411, 0.1517379731, 0.3564364311, 0.1541653872, 0.2375139445, 0.1466855109, 0.2658485472, 0.1382870525, 0.2666960061, 0.3291336298, 0.4681170881, 0.1254781187, 0.0886877403, 0.1492052078, 0.2059004903]

optimization:
  epochs: 5                      # Added 1 epoch → 5000 total steps
  steps_per_epoch: 1000
  lr: 1.0e-5
  encoder_lr_scale: 0.0          # Kept at 0 — no encoder fine-tuning
  weight_decay: 1.0e-4
  warmup_steps: 100
  ema_start: 0.996
  ema_end: 0.999
  grad_clip: 1.0
  precision: float32

  # Paired prediction weights (gentle DetSkill from v4)
  paired_delta_weight: 0.005
  paired_state_weight: 0.0
  paired_relative_delta_weight: 0.0
  paired_endpoint_variance_weight: 0.0

  # LSP-WM loss weights
  lspwm_dynamic_weight: 0.1     # Increased from 0.01 → gradients balance Koopman
  lspwm_force_weight: 0.1       # Increased from 0.05 → non-zero target now
  lspwm_koopman_weight: 0.05    # Reduced from 0.1 → compensate for dyn increase
  lspwm_msm_weight: 0.0
  lspwm_sequence_vamp_weight: 0.0
  lspwm_sequence_vamp_lag: 1
  lspwm_geometric_weight: 0.0
  lspwm_auxiliary_weight: 0.0
  lspwm_observation_weight: 0.0

  # New architectural loss weights (Rev-2, Rev-4)
  lspwm_trajectory_weight: 0.1   # Multi-step trajectory NLL weight
  lspwm_semigroup_weight: 0.01   # Semigroup consistency

  # Rollout weights (disabled; trajectory NLL replaces them)
  lspwm_rollout_energy_weight: 0.0
  lspwm_rollout_endpoint_weight: 0.0
  lspwm_rollout_gaussian_nll_weight: 0.0
  lspwm_rollout_distribution_weight: 0.0
  lspwm_rollout_koopman_weight: 0.0
  lspwm_rollout_force_weight: 0.0
  lspwm_rollout_trajectory_nll_weight: 0.0