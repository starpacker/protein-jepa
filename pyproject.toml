[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-jepa-frame"
version = "0.1.0"
description = "A clean V-JEPA-style latent prediction framework for protein dynamics."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "pyyaml",
  "h5py",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
eval = [
  "deeptime",
  "matplotlib",
  "scikit-learn",
  "scipy",
]
openfold = [
  "biopython",
  "dm-tree",
  "ml-collections",
]

[project.scripts]
protein-jepa-frame = "protein_jepa_frame.cli:main"

[tool.setuptools.packages.find]
include = ["protein_jepa_frame*"]

[tool.setuptools.package-data]
protein_jepa_frame = [
  "vendored/PROVENANCE.json",
  "vendored/openfold/resources/*.txt",
  "vendored/openfold/utils/kernel/csrc/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # Vendored official OpenFold uses non-tuple sequence indexing; harmless here.
  "ignore:Using a non-tuple sequence for multidimensional indexing:UserWarning",
]
