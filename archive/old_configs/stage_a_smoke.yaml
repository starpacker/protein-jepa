output_dir: artifacts/smoke_stage_a
seed: 42
deterministic: true
log_every: 1
save_every: 100
checkpoint_every_steps: 0
sync_target_after_init: true

data:
  batch_size: 2
  num_workers: 0
  num_frames: 4
  frame_stride: 1
  window_stride: 1
  synthetic_size: 8
  synthetic_residues: 16
  training_mode: paired_window
  paired_horizons_frames: [2, 4]

model:
  latent_dim: 128
  encoder_depth: 2
  temporal_depth: 1
  predictor_depth: 2
  num_heads: 2
  num_rbf: 8
  max_frames: 64
  max_residues: 128
  time_conditioning: "none"
  paired_forecast: true
  paired_predictor_depth: 2

mask:
  mode: block
  num_blocks: 1
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 0.0001
  epochs: 1
  steps_per_epoch: 5
  warmup_steps: 1
  weight_decay: 0.01
  grad_clip: 10.0
  ema_start: 0.0
  ema_end: 0.999
  encoder_lr_scale: 1.0
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.1
  lagged_state_jepa_weight: 0.0
  semigroup_weight: 0.0
  state_transition_weight: 0.0
  physchem_weight: 0.0
  linear_dynamics_weight: 0.0
  variance_reg: 0.0
  state_variance_reg: 0.0
  state_feature_variance_reg: 0.0
  state_covariance_reg: 0.0
  msm_state_weight: 0.0
  vamp2_weight: 0.0
  kinetic_vamp_weight: 0.0
  auxiliary_warmup_steps: 0
