seed: 5101
device: cuda:1
output_dir: /liuyutian/protein_jepa_frame/artifacts/phase5_v52_causal_history_pilot2
log_every: 20
save_every: 1
checkpoint_every_steps: 250
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/phase5_v51_sparse_motion_2k_action_state/checkpoint_step2000.pt
strict_init: false
sync_target_after_init: true

data:
  manifest_path: /liuyutian/protein_jepa/artifacts/manifests/mdcath.train.jsonl
  batch_size: 1
  num_workers: 0
  num_frames: 24
  frame_stride: 2
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [48, 64, 96, 128, 192]
  paired_nonoverlap_only: true
  paired_all_horizons: true
  load_forces: false

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  state_predictor_depth: 2
  state_prediction_lags: [1, 2, 4, 8, 12]
  lag_predictor_depth: 2
  paired_forecast: true
  paired_predictor_depth: 2
  paired_target_tower: causal
  paired_teacher_space_delta: true
  freeze_context_encoder: false
  causal_encoder_gradient_scale: 1.0
  temporal_causal: true
  temporal_position_encoding: learned
  transition_thermodynamic_conditioning: true
  v51_contextual_dynamics_enabled: true
  v51_state_dim: 32
  v51_num_modes: 16
  v51_active_modes: 4
  v51_base_step_ps: 16000.0
  v51_max_rollout_steps: 16
  v51_router_temperature: 0.5
  v51_routing_noise_std: 0.05
  v51_active_temperature: 0.2
  v51_log_sigma_min: -5.0
  v51_log_sigma_max: 1.0
  v51_observable_dim: 12
  v51_observable_state_weight: 0.5
  v51_control_horizons_frames: [48, 64, 96, 128, 192]
  v51_training_controls: true
  v51_causal_prediction_enabled: true
  v5_contextual_dynamics_enabled: false
  local_dynamics_enabled: false
  closed_local_state_enabled: false
  v4_slow_state_enabled: false
  v4_physics_state_enabled: false
  slow_state_enabled: false
  observable_head: false
  probabilistic_transition: false
  metastable_state_dim: 0
  frame_pooling: kinetic_query
  frame_pool_queries: 4
  num_heads: 4
  num_rbf: 16
  dropout: 0.05
  max_frames: 64
  max_residues: 4096
  feature_norm: true

optimization:
  epochs: 1
  steps_per_epoch: 300
  lr: 0.0002
  encoder_lr_scale: 0.05
  weight_decay: 0.02
  warmup_steps: 200
  ema_start: 0.996
  ema_end: 0.9999
  grad_clip: 1.0
  precision: float32
  paired_delta_weight: 0.0
  paired_state_weight: 0.0
  paired_endpoint_variance_weight: 0.0
  causal_alignment_weight: 0.0
  offline_forecast_weight: 0.0
  observable_weight: 0.0
  gaussian_nll_weight: 0.0
  metastable_vamp_weight: 0.0
  metastable_balance_weight: 0.0
  metastable_entropy_weight: 0.0
