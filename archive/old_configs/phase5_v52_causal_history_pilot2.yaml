  closed_local_state_weight: 0.0
  horizon_ranking_weight: 0.0
  horizon_difference_weight: 0.0
  v4_slow_reconstruction_weight: 0.0
  v4_slow_vamp_weight: 0.0
  v4_slow_balance_weight: 0.0
  v4_slow_entropy_weight: 0.0
  v4_slow_base_transition_weight: 0.0
  v4_slow_rollout_transition_weight: 0.0
