seed: 307
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/phase3_v3_0_history_metastable_2k
log_every: 20
save_every: 1
checkpoint_every_steps: 2000
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/mdcath_state_jepa_multilag/checkpoint_step20000.pt
strict_init: false
sync_target_after_init: true
init_copy_temporal_to_offline: true
init_exclude_prefixes:
  - temporal_encoder.
  - target_temporal_encoder.
  - state_predictor.
  - lagged_state_predictor.

data:
  manifest_path: /liuyutian/protein_jepa/artifacts/manifests/mdcath.train.jsonl
  batch_size: 8
  num_workers: 0
  num_frames: 24
  frame_stride: 2
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [48, 96, 192]
  paired_nonoverlap_only: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  offline_temporal_depth: 2
  causal_temporal_depth: 2
  dual_temporal_towers: true
  predictor_depth: 4
  frame_pooling: mean
  time_conditioning: none
  thermodynamic_conditioning: false
  orientation_features: false
  temporal_causal: true
  temporal_position_encoding: learned
  temporal_delta_features: false
  transition_thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 3
  paired_teacher_space_delta: true
  paired_target_tower: offline
  freeze_context_encoder: true
  freeze_offline_temporal_encoder: true
  causal_encoder_gradient_scale: 0.0
  history_conditioned_transition: true
  history_transition_strides: [1, 2, 4, 8]
  metastable_state_dim: 8
  slow_predictor_depth: 2
  slow_state_enabled: false
  observable_head: true
  observable_dim: 12
  observable_target_version: v3
  probabilistic_transition: false
  num_heads: 4
  num_rbf: 16
  dropout: 0.1
  max_frames: 64
  max_residues: 4096
  feature_norm: false

optimization:
  epochs: 1
  steps_per_epoch: 2000
  lr: 0.0003
  encoder_lr_scale: 0.0
  offline_lr_scale: 0.0
  weight_decay: 0.03
  warmup_steps: 300
  ema_start: 0.996
  ema_end: 0.9999
  grad_clip: 1.0
  precision: float32
  paired_delta_weight: 1.0
  paired_state_weight: 0.25
  paired_endpoint_variance_weight: 0.0
  causal_alignment_weight: 0.0
  offline_forecast_weight: 0.0
  observable_weight: 0.25
  gaussian_nll_weight: 0.0
  metastable_vamp_weight: 0.20
  metastable_balance_weight: 0.02
  metastable_entropy_weight: 0.005
  slow_delta_weight: 0.0
  slow_state_weight: 0.0
  slow_contrastive_weight: 0.0
  slow_variance_weight: 0.0
  slow_covariance_weight: 0.0
