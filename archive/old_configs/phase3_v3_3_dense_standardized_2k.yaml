seed: 323
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/phase3_v3_3_dense_standardized_2k
log_every: 20
save_every: 1
checkpoint_every_steps: 500
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/phase3_v3_2_closed_multihorizon_2k/checkpoint_step1500.pt
strict_init: false
sync_target_after_init: false

data:
  manifest_path: /liuyutian/protein_jepa/artifacts/manifests/mdcath.train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 24
  frame_stride: 2
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [48, 64, 96, 128, 192]
  paired_nonoverlap_only: true
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  offline_temporal_depth: 2
  causal_temporal_depth: 2
  dual_temporal_towers: true
  predictor_depth: 4
  frame_pooling: mean
  time_conditioning: none
  thermodynamic_conditioning: false
  orientation_features: false
  temporal_causal: true
  temporal_position_encoding: learned
  temporal_delta_features: false
  transition_thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 3
  paired_teacher_space_delta: true
  paired_target_tower: offline
  freeze_context_encoder: true
  freeze_offline_temporal_encoder: true
  causal_encoder_gradient_scale: 0.0
  history_conditioned_transition: true
  history_transition_strides: [1, 2, 4, 8]
  metastable_state_dim: 8
  local_dynamics_enabled: true
  local_observable_targets: false
  local_dynamics_tokens: 4
  local_dynamics_dim: 32
  closed_local_state_enabled: true
  closed_local_state_dim: 12
  closed_local_horizons: [48, 64, 96, 128, 192]
  closed_local_state_scale:
    - 0.0087739408
    - 0.0556835886
    - 0.0788662833
    - 0.0290122274
    - 0.0630399014
    - 0.0952679255
    - 0.0050671150
    - 0.1376191897
    - 0.0340227567
    - 0.0254647000
    - 0.2193777483
    - 0.0089304796
  slow_predictor_depth: 2
  slow_state_enabled: false
  observable_head: true
  observable_dim: 12
  observable_target_version: v3
  probabilistic_transition: false
  num_heads: 4
  num_rbf: 16
  dropout: 0.05
  max_frames: 64
  max_residues: 4096
  feature_norm: false

optimization:
  epochs: 1
  steps_per_epoch: 2000
  lr: 0.0003
  encoder_lr_scale: 0.0
  offline_lr_scale: 0.0
  weight_decay: 0.03
  warmup_steps: 300
  ema_start: 0.9999
  ema_end: 0.9999
  grad_clip: 1.0
  precision: float32
  paired_delta_weight: 0.0
  paired_state_weight: 0.0
  paired_endpoint_variance_weight: 0.0
  causal_alignment_weight: 0.0
  offline_forecast_weight: 0.0
  observable_weight: 0.0
  gaussian_nll_weight: 0.0
  metastable_vamp_weight: 0.0
  metastable_balance_weight: 0.0
  metastable_entropy_weight: 0.0
  local_observable_weight: 0.0
  closed_local_state_weight: 1.0
  horizon_ranking_weight: 1.0
  horizon_ranking_margin: 0.05
  slow_delta_weight: 0.0
  slow_state_weight: 0.0
  slow_contrastive_weight: 0.0
  slow_variance_weight: 0.0
  slow_covariance_weight: 0.0
