# LSP-WM v4.1 unified 256D rollout curriculum training.
# Five canonical phases (Ch.7.2):
#   I   representation (0-500)       : L_koop + L_repr (shaping the representation)
#   II  thermodynamic_id (500-1000)  : L_force + L_dyn (fit PMF, diffusion, bath)
#   III dynamics (1000-1500)         : L_dyn (fine-tune transition)
#   IV  rollout (1500-3500)          : multi-step rollout self-consistency
#   V   observation (3500-4000)      : L_obs (decoder only, not used here)
seed: 6303
device: cuda:0
output_dir: /liuyutian/protein_jepa_frame/artifacts/lspwm_v41_mdCATH_20260908_bs16
log_every: 25
save_every: 1
checkpoint_every_steps: 500

data:
  manifest_path: /liuyutian/protein_jepa_frame/manifests/tmjepa_v3.train.jsonl
  batch_size: 16
  num_workers: 0
  num_frames: 24
  frame_stride: 1
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical
  training_mode: paired_window
  paired_horizons_frames: [1, 2, 4, 8, 16]
  paired_all_horizons: false

model:
  latent_dim: 256
  encoder_depth: 2
  temporal_depth: 2
  predictor_depth: 1
  paired_forecast: true
  paired_predictor_depth: 2
  temporal_causal: true
  temporal_causal_window: 4
  temporal_position_encoding: none
  orientation_features: true
  frame_pooling: kinetic_query
  frame_pool_queries: 4
  num_heads: 8
  num_rbf: 16
  dropout: 0.0
  feature_norm: true
  freeze_context_encoder: false
  freeze_temporal_encoder: false
  tmjepa_enabled: false
  lspwm_enabled: true
  lspwm_num_segments: 3
  lspwm_learned_cv_dim: 256
  lspwm_condition_dim: 64
  lspwm_auxiliary_dim: 4
  lspwm_koopman_role_dim: 64
  lspwm_msm_role_dim: 32
  lspwm_geometric_role_dim: 96
  lspwm_auxiliary_role_dim: 64
  lspwm_role_hidden_dim: 256
  lspwm_reference_temperature_k: 348.0
  lspwm_diffusion_scale: 1.0e-3
  lspwm_coupling_scale: 1.0e-3
  lspwm_memory_times_ps: [1000.0, 2000.0, 4000.0, 8000.0]
  lspwm_mean_force_bandwidth: 4.0
  lspwm_observation_model: false
  lspwm_observation_coord_dim: 0
  lspwm_history_closure_enabled: false
  lspwm_rollout_enabled: true
  lspwm_rollout_steps: 8
  lspwm_rollout_warmup_steps: 500
  lspwm_rollout_ensemble_size: 4
  lspwm_curriculum_steps: [0, 500, 1000, 1500, 3500]
  lspwm_cv_mean: [0.5808744431, 1.0378025770, -3.5378422730, -1.6780833006, 0.3800410033, -2.7798459530, 0.3983616233, -2.7939324379, 0.3888407946, -2.7732858658, 0.4555905461, 0.3484444022, 1.0433561802, -0.0431454852, -0.0774244592, -0.2054995447]
  lspwm_cv_scale: [0.0796646103, 0.5420896411, 0.1517379731, 0.3564364311, 0.1541653872, 0.2375139445, 0.1466855109, 0.2658485472, 0.1382870525, 0.2666960061, 0.3291336298, 0.4681170881, 0.1254781187, 0.0886877403, 0.1492052078, 0.2059004903]

optimization:
  epochs: 4
  steps_per_epoch: 1000
  lr: 1.0e-4
  encoder_lr_scale: 0.2
  weight_decay: 1.0e-5
  warmup_steps: 50
  grad_clip: 1.0
  paired_delta_weight: 0.0
  paired_state_weight: 0.0
  paired_endpoint_variance_weight: 0.0
  # Phase I: representation (koopman, msm, geometric, auxiliary)
  lspwm_dynamic_weight: 1.0
  lspwm_force_weight: 1.0
  lspwm_koopman_weight: 1.0
  lspwm_msm_weight: 0.5
  lspwm_geometric_weight: 1.0
  lspwm_auxiliary_weight: 0.5
  lspwm_observation_weight: 0.0
  # Phase IV: rollout self-consistency
  lspwm_rollout_energy_weight: 0.5
  lspwm_rollout_distribution_weight: 0.25
  lspwm_rollout_koopman_weight: 0.5
  lspwm_rollout_force_weight: 0.25
  lspwm_rollout_trajectory_nll_weight: 1.0
