seed: 67
device: auto
output_dir: /liuyutian/protein_jepa_frame/artifacts/phase2_a3_mdcath_state_motion_semigroup
log_every: 20
save_every: 1
checkpoint_every_steps: 2000
init_checkpoint: /liuyutian/protein_jepa_frame/artifacts/phase2_a2_mdcath_split_state_motion/checkpoint_step8000.pt
strict_init: false
sync_target_after_init: true
init_exclude_prefixes:
  - lagged_state_predictor.
  - state_predictor.
  - temporal_encoder.time_embed.
  - temporal_encoder.motion_
  - temporal_encoder.state_motion_
  - target_temporal_encoder.time_embed.
  - target_temporal_encoder.motion_
  - target_temporal_encoder.state_motion_

data:
  manifest_path: /liuyutian/protein_jepa/artifacts/manifests/mdcath.train.jsonl
  batch_size: 4
  num_workers: 0
  num_frames: 24
  frame_stride: 2
  window_stride: 8
  max_residues: 384
  sampling_mode: hierarchical

mask:
  mode: future
  num_blocks: 2
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2
  future_context_ratio: 0.5
  future_gap_frames: 4

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  state_predictor_depth: 2
  state_prediction_lags: [1, 2, 4, 8, 12]
  frame_pooling: mean
  lag_predictor_depth: 2
  lag_predictor_dropout: 0.0
  lag_conditioning: embedding
  lag_prediction_mode: residual
  time_conditioning: none
  thermodynamic_conditioning: false
  transition_thermodynamic_conditioning: true
  orientation_features: true
  temporal_causal: true
  temporal_position_encoding: none
  temporal_delta_features: false
  motion_depth: 1
  motion_stopgrad_input: true
  transition_source: state_motion
  num_heads: 4
  num_rbf: 16
  dropout: 0.0
  max_frames: 64
  max_residues: 4096
  feature_norm: true

optimization:
  epochs: 4
  steps_per_epoch: 5000
  lr: 0.0003
  encoder_lr_scale: 0.2
  weight_decay: 0.05
  warmup_steps: 1000
  auxiliary_warmup_steps: 3000
  ema_start: 0.996
  ema_end: 1.0
  grad_clip: 1.0
  precision: float32
  residue_jepa_weight: 0.1
  state_jepa_weight: 0.0
  lagged_state_jepa_weight: 0.5
  semigroup_weight: 0.02
  variance_reg: 0.0
  state_variance_reg: 0.0
  state_feature_variance_reg: 0.0
  state_covariance_reg: 0.0
  msm_state_weight: 0.0
  vamp2_weight: 0.0
