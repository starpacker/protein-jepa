checkpoint_every_steps: 0
data:
  batch_size: 2
  frame_stride: 1
  num_frames: 4
  num_workers: 0
  paired_horizons_frames:
  - 2
  - 4
  synthetic_residues: 16
  synthetic_size: 8
  training_mode: paired_window
  window_stride: 1
deterministic: true
init_checkpoint: artifacts/smoke_stage_a/checkpoint_latest.pt
log_every: 1
mask:
  min_context_ratio: 0.2
  mode: block
  num_blocks: 1
  residue_scale:
  - 0.15
  - 0.4
  temporal_scale:
  - 0.25
  - 0.5
model:
  encoder_depth: 2
  freeze_context_encoder: true
  freeze_target_encoders: false
  freeze_temporal_encoder: true
  latent_dim: 128
  lspwm_dynamic_nll_enabled: false
  lspwm_enabled: true
  lspwm_rollout_enabled: false
  max_frames: 64
  max_residues: 128
  num_heads: 2
  num_rbf: 8
  paired_forecast: true
  paired_predictor_depth: 2
  predictor_depth: 2
  temporal_depth: 1
  time_conditioning: none
optimization:
  auxiliary_warmup_steps: 0
  ema_end: 0.999
  ema_start: 0.0
  encoder_lr_scale: 1.0
  epochs: 1
  grad_clip: 10.0
  kinetic_vamp_weight: 0.0
  lagged_state_jepa_weight: 1.0
  linear_dynamics_weight: 0.0
  lr: 0.0001
  lspwm_dynamic_weight: 0.0
  lspwm_rollout_distribution_weight: 0.0
  lspwm_rollout_endpoint_weight: 0.0
  lspwm_rollout_energy_weight: 0.0
  lspwm_rollout_force_weight: 0.0
  lspwm_rollout_gaussian_nll_weight: 0.0
  lspwm_rollout_koopman_weight: 0.0
  lspwm_rollout_trajectory_nll_weight: 0.0
  msm_state_weight: 0.0
  physchem_weight: 0.0
  residue_jepa_weight: 1.0
  semigroup_weight: 0.0
  state_covariance_reg: 0.0
  state_feature_variance_reg: 0.0
  state_jepa_weight: 0.1
  state_transition_weight: 0.0
  state_variance_reg: 0.0
  steps_per_epoch: 5
  vamp2_weight: 0.0
  variance_reg: 0.0
  warmup_steps: 1
  weight_decay: 0.01
output_dir: artifacts/smoke_stage_b
save_every: 100
seed: 42
