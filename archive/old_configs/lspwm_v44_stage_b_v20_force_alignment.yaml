# LSP-WM v20: Force direction alignment — scarcity M_Force != M_None
#
# Root cause (v19): bath_aware_drift_matching matches the SUM (-D∇U + bath) against Δq,
#   but ∇U never gets an independent alignment signal because:
#   1. The bath (~97% of drift) absorbs Δq → ∇U sees only noise
#   2. force_structure_regularization rewards directional *diversity* in the batch,
#      which actively cancels the batch-averaged ⟨∇U, Δq⟩ to zero
#   3. M1 OLS: force_scale = ⟨∇U·dt, Δq⟩ / ‖∇U·dt‖² → ⟨...⟩ ≈ 0 → force_scale=0 → M_Force=M_None
#
# Fix: new lspwm_conservative_alignment_loss = (1 - cos(conservative_drift, Δq - bath_drift))
#   - Forces ∇U direction toward the bath-unexplained residual
#   - Only requires DIRECTION alignment, not magnitude (magnitude handled by existing losses)
#   - Added in bath_aware_drift_matching_loss loop, computed per step
#   - Weight 0.5 in dynamics/rollout phases
#
# Changes vs v19:
#   lspwm_conservative_alignment_weight: 0 → 0.5  (new! the fix)
#   Code changes:
#     lspwm.py: bath_aware_drift_matching_loss → alignment_sum + "alignment" in return
#     train.py: lspwm_conservative_alignment_loss → total_loss + logging
#     config.py: lspwm_conservative_alignment_weight in ModelConfig + OptimizationConfig
#   init_checkpoint: v19 (continue from bath-aware state)
#

init_checkpoint: artifacts/lspwm_v44_stage_b_v19_bath_aware/checkpoint_latest.pt
init_exclude_prefixes:
  - lspwm.world_model.physical_calibration.log_mobility_scale
  - lspwm.world_model.physical_calibration.log_free_energy_scale
sync_target_after_init: true
strict_init: true
init_copy_temporal_to_offline: false

data:
  manifest: manifests/tmjepa_v3.train.jsonl
  batch_size: 32
  num_workers: 8
  prefetch_factor: 2

mask:
  mask_ratio: 0.15

model:
  lspwm_encoder_dim: 256
  lspwm_state_dim: 128
  lspwm_auxiliary_dim: 32
  lspwm_hidden_dim: 1024
  lspwm_physical_calibration_enabled: false
  lspwm_midpoint_integration: false
  lspwm_rollout_trajectory_steps: 8
  lspwm_semigroup_consistency_weight: 0.01
  lspwm_drift_magnitude_consistency_weight: 0.05
  lspwm_bath_aware_drift_matching_weight: 1.0
  lspwm_force_structure_weight: 0.05
  lspwm_conservative_alignment_weight: 0.5
  lspwm_curriculum_steps:
    - 0
    - 1200
    - 3000
    - 4800
    - 6000

optimization:
  learning_rate: 1e-4
  weight_decay: 0.0
  epochs: 6
  paired_delta_weight: 0.02
  paired_state_weight: 0.0
  paired_relative_delta_weight: 0.0
  lspwm_bath_aware_drift_matching_weight: 1.0
  lspwm_force_structure_weight: 0.05
  lspwm_conservative_alignment_weight: 0.5
  lspwm_drift_magnitude_consistency_weight: 0.05
  lspwm_dynamic_weight: 1.0
  lspwm_calibrated_dynamic_weight: 0.0
  lspwm_drift_matching_weight: 0.0
  lspwm_per_frame_drift_matching_weight: 50.0
  lspwm_force_weight: 0.0
  lspwm_semigroup_weight: 0.0
  lspwm_trajectory_weight: 1.0
  lspwm_rollout_enabled: false
  lspwm_rollout_steps: 4
  lspwm_rollout_ensemble_size: 4

seed: 6303
deterministic: false
device: cuda
output_dir: artifacts/lspwm_v44_stage_b_v20_force_alignment
log_every: 10
save_every: 10000
checkpoint_every_steps: 100
