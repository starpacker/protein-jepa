# Two-step real-data smoke for the repaired closed-loop Stage B path.
output_dir: artifacts/full_abc_stage_b_smoke_repaired
seed: 42
deterministic: false
device: cuda:0
log_every: 1
save_every: 1
checkpoint_every_steps: 0
init_checkpoint: artifacts/fast_abc_stage_a/checkpoint_latest.pt
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 1
  num_workers: 0
  num_frames: 4
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32]
  paired_all_horizons: false
  paired_history_mode: uniform

model:
  model_type: stage_b
  q_dim: 8
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  lspwm_per_residue_enabled: true
  lspwm_use_bath: true
  lspwm_history_aware: true
  lspwm_rollout_enabled: true
  lspwm_rollout_steps: 4
  lspwm_base_step_ps: 100.0

optimization:
  lr: 3.0e-5
  epochs: 1
  steps_per_epoch: 2
  warmup_steps: 1
  weight_decay: 0.01
  grad_clip: 10.0
  gradient_accumulation_steps: 1
  lagged_state_jepa_weight: 1.0
  state_jepa_weight: 0.1
  variance_reg: 0.01
  lspwm_rollout_trajectory_nll_weight: 0.1
  lspwm_semigroup_consistency_weight: 0.01
