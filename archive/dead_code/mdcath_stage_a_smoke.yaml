output_dir: artifacts/mdcath_stage_a_smoke
seed: 42
deterministic: false
log_every: 5
save_every: 10
checkpoint_every_steps: 500

data:
  manifest_path: artifacts/mdcath_manifest_smoke/train.jsonl
  batch_size: 4
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [4, 8]
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 2
  temporal_depth: 1
  predictor_depth: 2
  num_heads: 2
  num_rbf: 8
  max_frames: 64
  max_residues: 256
  dropout: 0.0
  feature_norm: true
  time_conditioning: "physical"
  thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 2
  paired_teacher_space_delta: true
  lspwm_enabled: false

mask:
  mode: block
  num_blocks: 1
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 3.0e-4
  encoder_lr_scale: 0.5
  epochs: 2
  steps_per_epoch: 10
  warmup_steps: 5
  weight_decay: 0.01
  grad_clip: 10.0
  ema_start: 0.0
  ema_end: 0.999
  precision: float32
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.25
  paired_delta_weight: 1.0
  paired_state_weight: 0.25
  variance_reg: 0.01
  state_variance_reg: 0.01
