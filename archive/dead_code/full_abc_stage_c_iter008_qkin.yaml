# Stage C iter_008: decode from a kinematic-routed Stage-B Q.
#
# Contrast with every prior Stage-C config:
#   * prior configs set decoder_basin_only_ca=True, which EVALUATES
#     dt_local = basin_dt_local and DISCARDS both the H/IPA residual and the
#     explicit Q->translation path.  That is the micro-explanation for the
#     oracle == direct == qshuffle collapse (Delta = 0.0000 A).
#   * iter_008 keeps Q on the critical path:
#         dt_local = frame_update + q_translation(Q) + gate * basin
#     so a Q ablation can actually change the decoded structure.
#   * the Stage-B checkpoint carries an explicit SE(3)-invariant kinematic
#     channel inside Q (StageBLASP_Kinematic), so Q is no longer empty.
#
# Curriculum: a short q_only phase (q_only_translation=True) forces the
# decoder to learn the Q->displacement map before the H/IPA shortcut
# reasserts itself, then the joint path is restored.
output_dir: artifacts/iter_008_stage_c
seed: 42
deterministic: false
device: cuda:0
log_every: 10
save_every: 1
checkpoint_every_steps: 250
init_checkpoint: artifacts/iter_008_stage_b_kinematic/checkpoint_latest.pt
stage_c_pretrained: null
stage_c_pretrained_exclude_q_position: false
resume_checkpoint: null
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: false
  paired_history_mode: uniform

model:
  model_type: stage_c
  q_dim: 8
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  decoder_max_translation_update: 0.5
  decoder_max_com_update: 4.0
  # The paired 32/64/96-frame targets have ~12.6 A RMS local relative
  # displacement; a 2 A cap (v3) could not represent it.
  decoder_max_q_translation_update: 16.0
  decoder_basin_only_ca: false
  stage_c_q_only_steps: 800
  anchor_noise_level: 0.0
  q_weight_ramp_start: 800
  q_weight_ramp_steps: 2500

optimization:
  lr: 2.0e-5
  epochs: 16
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 10.0
  gradient_accumulation_steps: 4
  steps_per_epoch: 300
  encoder_lr_scale: 0.2
  sc_fape_weight: 0.2
  sc_torsion_weight: 0.5
  sc_distance_weight: 0.3
  sc_bond_weight: 0.1
  sc_clash_weight: 0.05
  sc_ca_position_weight: 0.05
  sc_kabsch_weight: 1.0
  sc_contact_distance_weight: 1.0
  sc_contact_binary_weight: 2.0
  sc_auto_contact_weight: 1.5
  sc_auto_contact_warmup_steps: 0
  sc_auto_rollout_base_step_ps: 100.0
  sc_auto_rollout_max_substep_ps: 100.0
  q_translation_weight: 2.0
  q_only_translation_weight: 10.0
  q_translation_target_scale: 4.0
