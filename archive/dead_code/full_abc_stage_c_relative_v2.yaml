# Stage C v2: stable continuation from the last finite Stage-C checkpoint.
# Stage B is intentionally not extended; it remains the persisted step-2500 model.
output_dir: artifacts/full_abc_stage_c_relative_v2
seed: 42
deterministic: false
device: cuda:0
log_every: 10
save_every: 1
checkpoint_every_steps: 500
init_checkpoint: artifacts/full_abc_stage_b_v3_final/checkpoint_latest.pt
resume_checkpoint: artifacts/full_abc_stage_c_relative/checkpoint_latest.pt
stage_c_pretrained: null
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: false
  paired_history_mode: uniform

model:
  model_type: stage_c
  q_dim: 8
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  decoder_max_translation_update: 0.5
  decoder_max_com_update: 4.0
  anchor_noise_level: 0.0
  q_weight_ramp_start: 0
  q_weight_ramp_steps: 1000

optimization:
  lr: 5.0e-5
  epochs: 20
  warmup_steps: 500
  weight_decay: 0.01
  grad_clip: 10.0
  gradient_accumulation_steps: 4
  steps_per_epoch: 300
