# iter_005 — Basin-only CA decoder
#
# Root cause (diagnosed, probe_gate_cal / probe_basin_hz):
#   The IPA frame_update translation and q_translation add per-residue
#   displacement noise that TRIPLES the contact gap while providing no RMSD
#   benefit. Zeroing them in the current checkpoint raises contact skill ~3x
#   (e.g. hz32 +0.009 -> +0.040) at same RMSD. The analytic basin position is
#   the best legal context-only CA predictor at all horizons.
#
# Fix: decoder_basin_only_ca=true pins CA = anchor + basin_dt_local (gate=1),
#   removing the learned translation residual from the CA position path.
#   Rotation prediction and torsion prediction are unaffected, keeping atom37
#   geometry. The loss now trains only torsion/rotation, which converge fast.
#
# Honest ceiling: analytic basin cj_skill = +0.035..+0.051 (~half of +0.10 gate).
#   This iter captures the real, large, reproducible improvement correctly.
output_dir: artifacts/iter_005_basin_decoder
seed: 42
deterministic: false
device: cuda:0
log_every: 10
save_every: 1
checkpoint_every_steps: 200
init_checkpoint: artifacts/full_abc_stage_b_v3_final/checkpoint_latest.pt
stage_c_pretrained: artifacts/full_abc_stage_c_quse_v5/checkpoint_latest.pt
stage_c_pretrained_exclude_q_position: false
resume_checkpoint: null
strict_init: false
data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: false
  paired_history_mode: uniform
model:
  model_type: stage_c
  q_dim: 8
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  decoder_max_translation_update: 0.5
  decoder_max_com_update: 4.0
  decoder_max_q_translation_update: 2.0
  # THE KEY CHANGE: force CA = basin, remove learned translation noise
  decoder_basin_only_ca: true
  stage_c_q_only_steps: 0
  anchor_noise_level: 0.0
  q_weight_ramp_start: 0
  q_weight_ramp_steps: 0
optimization:
  lr: 1.0e-5
  epochs: 2
  warmup_steps: 50
  weight_decay: 0.01
  grad_clip: 5.0
  gradient_accumulation_steps: 4
  steps_per_epoch: 200
  encoder_lr_scale: 0.1
  sc_fape_weight: 0.2
  sc_torsion_weight: 0.5
  sc_distance_weight: 0.3
  sc_bond_weight: 0.1
  sc_clash_weight: 0.05
  sc_ca_position_weight: 0.05
  sc_kabsch_weight: 1.0
  sc_contact_distance_weight: 1.0
  sc_contact_binary_weight: 2.0
  # With basin_only_ca the CA output is Q-independent by construction, so the
  # autonomous SDE-rollout contact loss cannot affect any gate metric; disable it.
  sc_auto_contact_weight: 0.0
  sc_auto_contact_warmup_steps: 0
  sc_auto_rollout_base_step_ps: 100.0
  sc_auto_rollout_max_substep_ps: 100.0
