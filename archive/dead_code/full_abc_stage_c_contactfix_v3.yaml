# Stage C v3 (contactfix): retrain with the atom37 UNK fix in place so the
# Kabsch/contact gradients are clean, plus a direct binary contact-Jaccard
# objective (contact_binary) to move the three contact-Jaccard conditions that
# were losing to persistence.  Fresh optimizer/schedule (not a resume): we warm
# start the decoder geometry from the v2 checkpoint but re-anneal the LR.
output_dir: artifacts/full_abc_stage_c_contactfix_v3
seed: 42
deterministic: false
device: cuda:0
log_every: 10
save_every: 1
checkpoint_every_steps: 500
init_checkpoint: artifacts/full_abc_stage_b_v3_final/checkpoint_latest.pt
stage_c_pretrained: artifacts/full_abc_stage_c_relative_v2/checkpoint_latest.pt
stage_c_pretrained_exclude_q_position: true
resume_checkpoint: null
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: false
  paired_history_mode: uniform

model:
  model_type: stage_c
  q_dim: 8
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: true
  decoder_max_translation_update: 0.5
  decoder_max_com_update: 4.0
  anchor_noise_level: 0.0
  q_weight_ramp_start: 0
  q_weight_ramp_steps: 1000

optimization:
  lr: 3.0e-5
  epochs: 24
  warmup_steps: 300
  weight_decay: 0.01
  grad_clip: 10.0
  gradient_accumulation_steps: 4
  steps_per_epoch: 300
  encoder_lr_scale: 0.2
  # Eval-aligned Stage-C objective weights.
  sc_fape_weight: 0.2
  sc_torsion_weight: 0.5
  sc_distance_weight: 0.3
  sc_bond_weight: 0.1
  sc_clash_weight: 0.05
  sc_ca_position_weight: 0.05
  sc_kabsch_weight: 1.0
  sc_contact_distance_weight: 1.0
  sc_contact_binary_weight: 2.0
