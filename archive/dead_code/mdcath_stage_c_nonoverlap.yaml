# ═══════════════════════════════════════════════════════════════════════════════
# STATUS: CANONICAL — Stage C training with non-overlapping data protocol
# Depends on: artifacts/mdcath_stage_b_nonoverlap/checkpoint_latest.pt
# ═══════════════════════════════════════════════════════════════════════════════

output_dir: artifacts/mdcath_stage_c_nonoverlap
seed: 42
deterministic: false
log_every: 10
save_every: 1
checkpoint_every_steps: 500
device: cuda
init_checkpoint: artifacts/mdcath_stage_b_nonoverlap/checkpoint_latest.pt
strict_init: false

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 2
  num_workers: 2
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: "physical"
  thermodynamic_conditioning: true

optimization:
  lr: 5.0e-5
  epochs: 20
  warmup_steps: 300
  weight_decay: 0.01
  grad_clip: 1.0
  steps_per_epoch: 300
  lagged_state_jepa_weight: 1.0
  state_jepa_weight: 0.1
  variance_reg: 0.01
