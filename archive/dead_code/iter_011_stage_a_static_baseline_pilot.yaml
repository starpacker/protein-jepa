# Matched static Stage-A baseline for the Iter-011 pilot comparison.
output_dir: artifacts/iter_011_stage_a_rebuild/pilot_static_baseline
seed: 42
deterministic: false
device: cpu
log_every: 1
save_every: 1
checkpoint_every_steps: 20

data:
  manifest_path: artifacts/mdcath_manifest_smoke/train.jsonl
  batch_size: 2
  num_workers: 0
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 64
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64]
  paired_all_horizons: true

model:
  latent_dim: 32
  encoder_depth: 1
  temporal_depth: 1
  predictor_depth: 1
  state_predictor_depth: 1
  num_heads: 4
  num_rbf: 4
  max_frames: 32
  max_residues: 64
  dropout: 0.0
  feature_norm: true
  time_conditioning: physical
  thermodynamic_conditioning: false
  paired_forecast: true
  paired_predictor_depth: 1
  paired_teacher_space_delta: true
  use_dynamic_encoder: false

mask:
  mode: block
  num_blocks: 1
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 1.0e-4
  encoder_lr_scale: 0.5
  epochs: 1
  steps_per_epoch: 4
  warmup_steps: 1
  weight_decay: 0.01
  grad_clip: 1.0
  ema_start: 0.9
  ema_end: 0.99
  precision: float32
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.25
  stage_a_dynamic_jepa_weight: 0.0
  stage_a_dynamic_activity_weight: 0.0
  stage_a_dynamic_covariance_weight: 0.0
