# ═══════════════════════════════════════════════════════════════════════════════
# STATUS: CANONICAL — paper-eligible non-overlapping Stage A training config
# ═══════════════════════════════════════════════════════════════════════════════
# Non-overlap guarantee:
#   num_frames=8, frame_stride=4 → context raw frames [0,4,8,12,16,20,24,28]
#   horizon 32  → future [32,36,40,44,48,52,56,60]  → 0/8 shared ✅
#   horizon 64  → future [64,68,72,76,80,84,88,92]  → 0/8 shared ✅
#   horizon 96  → future [96,100,104,108,112,116,120,124] → 0/8 shared ✅
# Physical time (1000ps raw frame interval):
#   context: 0 - 28 ns,  future starts at 32, 64, 96 ns
#   last-context -> first-future dt: 4, 36, 68 ns
# ═══════════════════════════════════════════════════════════════════════════════

output_dir: artifacts/mdcath_stage_a_nonoverlap
seed: 42
deterministic: false
log_every: 50
save_every: 1
checkpoint_every_steps: 500
device: cuda

data:
  manifest_path: artifacts/mdcath_manifest_200dom/train.jsonl
  batch_size: 32
  num_workers: 4
  num_frames: 8
  frame_stride: 4
  window_stride: 4
  max_residues: 256
  coordinate_scale: 1.0
  training_mode: paired_window
  paired_horizons_frames: [32, 64, 96]
  paired_all_horizons: true

model:
  latent_dim: 128
  encoder_depth: 4
  temporal_depth: 2
  predictor_depth: 4
  num_heads: 4
  num_rbf: 16
  max_frames: 128
  max_residues: 256
  dropout: 0.1
  feature_norm: true
  time_conditioning: "physical"
  thermodynamic_conditioning: true
  paired_forecast: true
  paired_predictor_depth: 3
  paired_teacher_space_delta: true
  lspwm_enabled: false
  use_dynamic_encoder: true
  dynamic_fusion: "add"

mask:
  mode: block
  num_blocks: 2
  temporal_scale: [0.25, 0.5]
  residue_scale: [0.15, 0.4]
  min_context_ratio: 0.2

optimization:
  lr: 3.0e-4
  encoder_lr_scale: 0.5
  epochs: 30
  warmup_steps: 1000
  weight_decay: 0.05
  grad_clip: 1.0
  ema_start: 0.996
  ema_end: 1.0
  precision: float32
  residue_jepa_weight: 1.0
  state_jepa_weight: 0.25
  paired_delta_weight: 1.0
  paired_state_weight: 0.25
  variance_reg: 0.01
  state_variance_reg: 0.01
  state_feature_variance_reg: 0.01
  state_covariance_reg: 0.02
