# Schema-v2 example paths; override checkpoint locations explicitly after training.
name: smoke
manifest: artifacts/mdcath_manifest_200dom/val.jsonl
horizons_frames:
- 1
- 4
context_frames: 8
context_stride: 1
frame_stride: 1
temperatures: null
max_proteins: 2
n_rollout_reps: 2
seed: 0
temporal_lags: []
emit_multi_lag: false
variants:
- h_only
- h_ft
- h_plus_s
- persist
models:
  stage_a_ckpt: artifacts/repaired_v2/pilot_20261017/stage_a/checkpoint_latest.pt
  stage_a_predictor_ckpt: artifacts/repaired_v2/pilot_20261017/stage_a/checkpoint_latest.pt
  b1a_ckpt: artifacts/repaired_v2/pilot_20261017/stage_b1a/checkpoint_latest.pt
  b1b_ckpt: artifacts/repaired_v2/pilot_20261017/stage_b1b/checkpoint_latest.pt
split: protein_holdout
train_manifests:
- artifacts/mdcath_manifest_200dom/train.jsonl
allow_legacy: false
deterministic: true
max_trajectories_per_protein: 1
max_anchors_per_trajectory: 2
